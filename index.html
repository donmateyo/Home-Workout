<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BW Pro: Zero Scroll</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #00e676; /* Matrix Green */
            --text: #ffffff;
            --subtext: #b0b0b0;
            --danger: #ff5252;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            height: 100vh; /* Force viewport height */
            height: 100dvh; /* Dynamic viewport height for mobile */
            overflow: hidden; /* CRITICAL: No scrolling */
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- HEADER & TIMERS --- */
        header {
            flex: 0 0 auto;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            border-bottom: 1px solid #333;
        }

        .timer-box {
            font-variant-numeric: tabular-nums;
            font-weight: bold;
        }

        .total-time { font-size: 1.2rem; color: var(--accent); }
        .label { font-size: 0.7rem; color: var(--subtext); display: block; text-transform: uppercase; letter-spacing: 1px; }

        /* --- MAIN CONTENT (DYNAMIC) --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            text-align: center;
        }

        h1 { font-size: 2rem; margin: 0 0 10px 0; line-height: 1.1; }
        .current-reps { font-size: 3.5rem; font-weight: 800; color: var(--accent); margin: 10px 0; }
        .progression-tag { 
            background: #333; padding: 4px 12px; border-radius: 20px; 
            font-size: 0.8rem; color: var(--subtext); margin-bottom: 15px; display: inline-block;
        }

        /* --- CONTROLS --- */
        .controls {
            flex: 0 0 auto;
            padding: 20px;
            background: var(--card);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); color: #000; grid-column: span 2; }
        .btn-secondary { background: #333; color: var(--text); }
        .btn-danger { background: #3a1a1a; color: var(--danger); }

        /* --- FLOATING REST TIMER (Bottom Left) --- */
        #rest-overlay {
            position: fixed;
            bottom: 120px; /* Above controls */
            left: 20px;
            background: rgba(0,0,0,0.9);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 15px;
            width: 140px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
            transform: translateY(150%); /* Hidden by default */
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #rest-overlay.active { transform: translateY(0); }
        
        .rest-time-display { font-size: 2.5rem; font-weight: bold; color: var(--text); }
        .rest-config {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }
        .mini-btn {
            background: #333; border: none; color: white; width: 30px; height: 30px; border-radius: 50%; font-weight: bold;
        }

        /* --- SETTINGS MODAL --- */
        .modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            display: none;
            flex-direction: column;
            padding: 20px;
            justify-content: center;
        }
        .modal.open { display: flex; }
        .modal h2 { margin-top: 0; }
        .setting-row { margin-bottom: 20px; text-align: left; }
        .setting-row label { display: block; margin-bottom: 8px; color: var(--subtext); }
        .setting-row select, .setting-row input {
            width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: white; border-radius: 8px; font-size: 16px;
        }

    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div>
            <span class="label">Total Time</span>
            <span class="timer-box total-time" id="total-timer">00:00</span>
        </div>
        <div style="text-align: right;">
            <span class="label">Routine</span>
            <span class="timer-box">Full Body Strength</span>
        </div>
    </header>

    <!-- MAIN EXERCISE VIEW -->
    <main id="exercise-view">
        <span class="progression-tag" id="level-tag">Level 1</span>
        <h1 id="ex-name">Push-Ups</h1>
        <div class="current-reps" id="ex-reps">8 - 12</div>
        <div style="color: var(--subtext); font-size: 0.9rem;">Target Reps</div>
    </main>

    <!-- FLOATING REST TIMER -->
    <div id="rest-overlay">
        <span class="label">Resting</span>
        <div class="rest-time-display" id="rest-display">01:30</div>
        <div class="rest-config">
            <button class="mini-btn" onclick="adjustRest(-15)">-</button>
            <span style="font-size: 0.8rem; line-height: 30px;">Sec</span>
            <button class="mini-btn" onclick="adjustRest(15)">+</button>
        </div>
        <button style="margin-top:10px; width:100%; padding: 8px; background:var(--accent); border:none; border-radius:6px; font-weight:bold;" onclick="stopRest()">SKIP</button>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <button class="btn btn-secondary" onclick="changeLevel(-1)">Regression</button>
        <button class="btn btn-secondary" onclick="changeLevel(1)">Progression</button>
        <button class="btn btn-primary" onclick="completeSet()">COMPLETE SET & START REST</button>
        <button class="btn btn-danger" onclick="resetWorkout()" style="grid-column: span 2; font-size: 0.8rem; padding: 10px;">Reset Workout</button>
    </div>

    <!-- SETTINGS MODAL (Opens on App Load to set logic) -->
    <div id="settings-modal" class="modal open">
        <h2>⚙️ Setup</h2>
        <p style="color: #aaa; margin-bottom: 20px;">Select your current tier for each movement.</p>
        
        <div class="setting-row">
            <label>Push (Vertical/Horizontal)</label>
            <select id="set-push">
                <option value="0">Wall Pushups (Beginner)</option>
                <option value="1" selected>Incline Pushups (Novice)</option>
                <option value="2">Standard Pushups (Intermediate)</option>
                <option value="3">Diamond Pushups (Advanced)</option>
                <option value="4">Pseudo Planche Pushups (Elite)</option>
            </select>
        </div>

        <div class="setting-row">
            <label>Pull (Requires a bar or sturdy table)</label>
            <select id="set-pull">
                <option value="0">Doorframe Rows (Beginner)</option>
                <option value="1" selected>Australian Rows (Novice)</option>
                <option value="2">Chin-Up Negatives (Intermediate)</option>
                <option value="3">Chin-Ups (Advanced)</option>
                <option value="4">Pull-Ups (Elite)</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="saveSettings()">START TRAINING</button>
    </div>

    <script>
        // --- DATA: The "Golden 5" ---
        // Structure: [Name, RepScheme, DifficultyTier]
        const workoutPlan = [
            {
                category: "Vertical Push",
                progressions: [
                    { name: "Wall Pushups", reps: "20-30" },
                    { name: "Incline Pushups", reps: "15-20" },
                    { name: "Standard Pushups", reps: "10-15" },
                    { name: "Diamond Pushups", reps: "8-12" },
                    { name: "Pseudo Planche Pushups", reps: "6-10" }
                ]
            },
            {
                category: "Squat",
                progressions: [
                    { name: "Assisted Squats", reps: "20-30" },
                    { name: "Box Squats", reps: "15-20" },
                    { name: "Bodyweight Squats", reps: "15-25" },
                    { name: "Bulgarian Split Squats", reps: "8-12 /side" },
                    { name: "Pistol Squats", reps: "5-8 /side" }
                ]
            },
            {
                category: "Vertical Pull",
                progressions: [
                    { name: "Doorframe Rows", reps: "20-30" },
                    { name: "Australian Rows", reps: "15-20" },
                    { name: "Chin-Up Negatives", reps: "5-8" },
                    { name: "Chin-Ups", reps: "6-10" },
                    { name: "Pull-Ups", reps: "6-10" }
                ]
            },
            {
                category: "Hinge",
                progressions: [
                    { name: "Glute Bridges", reps: "20-30" },
                    { name: "Single Leg Glute Bridge", reps: "12-15" },
                    { name: "Romanian Deadlift (Bodyweight)", reps: "10-15" },
                    { name: "Hamstring Walkouts", reps: "8-12" },
                    { name: "Single Leg Deadlift", reps: "8-10" }
                ]
            },
            {
                category: "Core",
                progressions: [
                    { name: "Plank", reps: "60 sec" },
                    { name: "Hollow Body Hold", reps: "45 sec" },
                    { name: "Knee Raises", reps: "15-20" },
                    { name: "L-Sit Tuck", reps: "30 sec" },
                    { name: "Hanging Leg Raises", reps: "10-15" }
                ]
            }
        ];

        // --- STATE ---
        let currentStep = 0;
        let currentLevels = [1, 1, 1, 1, 1]; // Default novice
        let restDuration = 90; // Default 90s
        let restTimerInterval = null;
        let totalTimerInterval = null;
        let totalSeconds = 0;
        let isResting = false;

        // --- DOM ELEMENTS ---
        const elName = document.getElementById('ex-name');
        const elReps = document.getElementById('ex-reps');
        const elLevel = document.getElementById('level-tag');
        const restOverlay = document.getElementById('rest-overlay');
        const restDisplay = document.getElementById('rest-display');
        const totalTimeDisplay = document.getElementById('total-timer');

        // --- INITIALIZATION ---
        function saveSettings() {
            currentLevels[0] = parseInt(document.getElementById('set-push').value);
            currentLevels[2] = parseInt(document.getElementById('set-pull').value);
            
            document.getElementById('settings-modal').classList.remove('open');
            startTotalTimer();
            renderExercise();
        }

        function renderExercise() {
            const exerciseGroup = workoutPlan[currentStep];
            const levelIndex = currentLevels[currentStep];
            const data = exerciseGroup.progressions[levelIndex];

            // Animation effect
            elName.style.opacity = 0;
            setTimeout(() => {
                elName.innerText = data.name;
                elReps.innerText = data.reps;
                elLevel.innerText = exerciseGroup.category + " - Lvl " + (levelIndex + 1);
                elName.style.opacity = 1;
            }, 150);
        }

        // --- PROGRESSIVE OVERLOAD LOGIC ---
        function changeLevel(direction) {
            let lvl = currentLevels[currentStep];
            let newLvl = lvl + direction;
            
            // Clamp between 0 and 4
            if(newLvl >= 0 && newLvl < 5) {
                currentLevels[currentStep] = newLvl;
                renderExercise();
            }
        }

        // --- WORKOUT FLOW ---
        function completeSet() {
            // Sound effect (simple beep context)
            playBeep();

            if (currentStep < workoutPlan.length - 1) {
                currentStep++;
                startRest();
            } else {
                finishWorkout();
            }
        }

        function finishWorkout() {
            stopTotalTimer();
            elName.innerText = "WORKOUT COMPLETE";
            elReps.innerText = "🏆";
            elLevel.innerText = "Great job, Mateo!";
            
            // Change main button to restart
            const mainBtn = document.querySelector('.btn-primary');
            mainBtn.innerText = "FINISH & RESET";
            mainBtn.onclick = () => location.reload();
        }

        function resetWorkout() {
            if(confirm("Reset entire workout?")) location.reload();
        }

        // --- TIMERS ---
        
        // Rest Timer
        function startRest() {
            isResting = true;
            restOverlay.classList.add('active');
            let left = restDuration;
            updateRestDisplay(left);

            clearInterval(restTimerInterval);
            restTimerInterval = setInterval(() => {
                left--;
                updateRestDisplay(left);
                if (left <= 0) {
                    stopRest();
                }
            }, 1000);
        }

        function updateRestDisplay(val) {
            let m = Math.floor(val / 60);
            let s = val % 60;
            restDisplay.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function stopRest() {
            clearInterval(restTimerInterval);
            restOverlay.classList.remove('active');
            renderExercise(); // Load next exercise
        }

        function adjustRest(amount) {
            // This adjusts the *current* ongoing rest, and sets the default for next time
            restDuration += amount;
            if(restDuration < 15) restDuration = 15;
            updateRestDisplay(restDuration);
        }

        // Total Timer
        function startTotalTimer() {
            totalTimerInterval = setInterval(() => {
                totalSeconds++;
                let m = Math.floor(totalSeconds / 60);
                let s = totalSeconds % 60;
                totalTimeDisplay.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }, 1000);
        }

        function stopTotalTimer() {
            clearInterval(totalTimerInterval);
        }

        // Simple Audio Beep for transition
        function playBeep() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 880; // A5
            gain.gain.value = 0.1;
            osc.start();
            setTimeout(() => osc.stop(), 100);
        }

    </script>
</body>
</html>
