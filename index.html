<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bodyweight Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: #0f0f11;
            --border: #1a1a1d;
            --text: #e5e5e5;
            --muted: #6b7280;
            --accent: #10b981; /* Emerald */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh; /* Dynamic height for mobile */
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        h1, h2, h3, .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Custom Checkbox */
        .set-check {
            appearance: none;
            width: 28px;
            height: 28px;
            border: 1px solid var(--border);
            background: #000;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .set-check:checked {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .set-check:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
        }

        /* Level Pill */
        .level-pill {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            background: #1a1a1d;
            color: var(--muted);
            border: 1px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
        }

        .level-pill.active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent);
            border-color: rgba(16, 185, 129, 0.3);
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Input Resets */
        input[type="number"] {
            -moz-appearance: textfield;
            background: transparent;
            border: none;
            color: var(--text);
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            width: 32px;
            text-align: center;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        /* Safe Area Padding for Footer */
        .footer-safe {
            padding-bottom: env(safe-area-inset-bottom, 12px);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="flex-shrink-0 px-4 pt-2 pb-1 border-b border-[#1a1a1d]">
        <div class="flex justify-between items-center h-10">
            <h1 class="text-lg font-bold tracking-tight leading-none">Routine</h1>
            <div class="flex items-center gap-3">
                <button id="histBtn" class="p-1 opacity-60 hover:opacity-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </button>
                <div class="flex items-center gap-1.5 text-emerald-400">
                   <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.75 3.03v.568c0 .334.148.65.405.864l1.068.89c.442.369.535 1.01.216 1.49l-.51.766a2.25 2.25 0 01-1.161.886l-.143.048a1.107 1.107 0 00-.57 1.664c.369.555.169 1.307-.427 1.605L9 13.125l.423 1.059a.956.956 0 01-1.652.928l-.679-.906a1.125 1.125 0 00-1.906.172L4.5 15.75l-.612.153M12.75 3.031a9 9 0 00-8.862 12.872M12.75 3.031a9 9 0 016.69 14.036m0 0l-.177-.529A2.25 2.25 0 0017.128 15H16.5l-.324-.324a1.453 1.453 0 00-2.328.377l-.036.073a1.586 1.586 0 01-.982.816l-.99.282c-.55.157-.894.702-.8 1.267l.073.438c.08.474.49.821.97.821.846 0 1.598.542 1.865 1.345l.215.643m5.276-3.67a9.012 9.012 0 01-5.276 3.67m0 0a9 9 0 01-10.275-4.835M15.75 9c0 .896-.393 1.7-1.016 2.25"/></svg>
                   <span id="streakNum" class="text-xs font-bold">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main List Container -->
    <main id="listContainer" class="flex-1 overflow-y-auto hide-scrollbar px-3 py-2 space-y-2">
        <!-- JS injects rows here -->
    </main>

    <!-- Footer -->
    <footer class="flex-shrink-0 border-t border-[#1a1a1d] bg-[#0a0a0a] footer-safe">
        <div class="flex items-center justify-between px-4 py-1 text-[10px] text-[#6b7280] uppercase tracking-wider">
            <span>Progress: <span id="progCount" class="text-white font-bold">0/6</span></span>
            <span>Volume: <span id="volCount" class="text-white font-bold">0</span> reps</span>
        </div>
        <button id="mainAction" class="w-full py-3 bg-emerald-600 text-white font-bold text-sm uppercase tracking-widest hover:bg-emerald-500 active:scale-[0.98] transition-all">
            Start
        </button>
    </footer>

    <!-- Timer Overlay -->
    <div id="timerOverlay" class="overlay flex-col">
        <div class="text-center">
            <p class="text-xs uppercase tracking-[0.2em] text-[#6b7280] mb-6">Rest Period</p>
            <div class="relative w-40 h-40 mx-auto mb-6">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" stroke="#1a1a1d" stroke-width="4" fill="none"/>
                    <circle id="timerRing" cx="50" cy="50" r="45" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="0"></circle>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span id="timerDisplay" class="text-5xl font-bold font-display">60</span>
                </div>
            </div>
            <p id="timerNextLabel" class="text-sm text-white mb-8">Next: Exercise</p>
            <div class="flex gap-3 justify-center">
                <button id="skipBtn" class="px-6 py-2 bg-white/5 border border-white/10 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Skip</button>
                <button id="addTimeBtn" class="px-6 py-2 bg-white/5 border border-white/10 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">+30s</button>
            </div>
        </div>
    </div>

    <!-- History Overlay -->
    <div id="histOverlay" class="overlay justify-start pt-10 overflow-y-auto">
        <div class="w-full max-w-md mx-auto px-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold font-display">History</h2>
                <button id="closeHistBtn" class="p-2 hover:bg-white/5 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="histList" class="space-y-2 pb-10">
                <!-- History content -->
            </div>
        </div>
    </div>

    <script>
        // --- 1. DATA & CONFIG ---
        const EXERCISES = [
            { id: 'push', name: 'Push-ups', levels: ['Wall', 'Incline', 'Kneeling', 'Standard', 'Decline', 'Diamond', 'Archer'], defLevel: 3, defSets: 3, defReps: 10 },
            { id: 'squat', name: 'Squats', levels: ['Assisted', 'Partial', 'Parallel', 'Deep', 'Pistol-Assist', 'Pistol'], defLevel: 3, defSets: 3, defReps: 12 },
            { id: 'pull', name: 'Pull-ups', levels: ['Dead Hang', 'Scapular', 'Negatives', 'Chin-up', 'Pull-up', 'Wide Grip', 'Weighted'], defLevel: 3, defSets: 3, defReps: 5 },
            { id: 'dip', name: 'Dips', levels: ['Bench', 'Assisted', 'Negatives', 'Standard', 'Deep', 'Weighted'], defLevel: 0, defSets: 3, defReps: 10 },
            { id: 'hinge', name: 'Leg Raises', levels: ['Knee Tucks', 'Floor Raises', 'Hanging Knee', 'Hanging Leg', 'Toes-to-Bar'], defLevel: 1, defSets: 3, defReps: 12 },
            { id: 'lunge', name: 'Lunges', levels: ['Assisted', 'Static', 'Forward', 'Reverse', 'Walking', 'Jumping'], defLevel: 2, defSets: 3, defReps: 10 }
        ];

        const STORE_KEY = 'bwp_v1';
        let state = loadState();
        let timerInterval = null;

        function loadState() {
            try {
                const data = localStorage.getItem(STORE_KEY);
                if (!data) return initFreshState();
                return JSON.parse(data);
            } catch (e) {
                return initFreshState();
            }
        }

        function initFreshState() {
            const s = { ex: {}, hist: [], streak: 0 };
            EXERCISES.forEach(e => {
                s.ex[e.id] = { lvl: e.defLevel, sets: e.defSets, reps: e.defReps, done: [] };
            });
            return s;
        }

        function saveState() {
            localStorage.setItem(STORE_KEY, JSON.stringify(state));
        }

        // --- 2. RENDERING ---
        const listContainer = document.getElementById('listContainer');
        const progCountEl = document.getElementById('progCount');
        const volCountEl = document.getElementById('volCount');
        const streakEl = document.getElementById('streakNum');
        const mainActionBtn = document.getElementById('mainAction');

        function renderAll() {
            listContainer.innerHTML = '';
            let completedCount = 0;
            let totalVol = 0;

            EXERCISES.forEach(ex => {
                const st = state.ex[ex.id];
                const doneCount = st.done.filter(Boolean).length;
                if (doneCount >= st.sets) completedCount++;
                totalVol += st.done.reduce((a, b) => a + (b || 0), 0);

                const card = document.createElement('div');
                card.className = 'bg-[#0f0f11] rounded-lg border border-[#1a1a1d] p-3 space-y-2';
                
                // Header Row
                const topRow = document.createElement('div');
                topRow.className = 'flex justify-between items-center';
                topRow.innerHTML = `
                    <h3 class="font-bold text-sm">${ex.name}</h3>
                    <div class="flex items-center gap-1 text-xs text-[#6b7280]">
                        <input type="number" class="sets-input" data-id="${ex.id}" value="${st.sets}" min="1" max="10">
                        <span class="opacity-70 font-sans">×</span>
                        <input type="number" class="reps-input" data-id="${ex.id}" value="${st.reps}" min="1" max="100">
                    </div>
                `;
                card.appendChild(topRow);

                // Levels Row
                const lvlRow = document.createElement('div');
                lvlRow.className = 'flex gap-1 overflow-x-auto hide-scrollbar py-1';
                ex.levels.forEach((lvlName, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `level-pill ${idx === st.lvl ? 'active' : ''}`;
                    btn.textContent = lvlName;
                    btn.onclick = () => {
                        state.ex[ex.id].lvl = idx;
                        saveState();
                        renderAll();
                    };
                    lvlRow.appendChild(btn);
                });
                card.appendChild(lvlRow);

                // Checkboxes Row
                const checkRow = document.createElement('div');
                checkRow.className = 'flex items-center justify-between pt-1 border-t border-[#1a1a1d]';
                
                const label = document.createElement('span');
                label.className = 'text-[10px] text-[#6b7280] uppercase tracking-wider';
                label.textContent = 'Sets';
                checkRow.appendChild(label);

                const checksContainer = document.createElement('div');
                checksContainer.className = 'flex gap-2';
                
                for (let i = 0; i < st.sets; i++) {
                    const chk = document.createElement('input');
                    chk.type = 'checkbox';
                    chk.className = 'set-check';
                    chk.checked = !!st.done[i];
                    chk.onchange = (e) => {
                        // If checked, set to target reps, else false
                        if(e.target.checked) {
                            state.ex[ex.id].done[i] = state.ex[ex.id].reps;
                        } else {
                            state.ex[ex.id].done[i] = false;
                        }
                        saveState();
                        updateStats(); // Just update stats, no full re-render needed for checkbox click
                    };
                    checksContainer.appendChild(chk);
                }
                checkRow.appendChild(checksContainer);
                card.appendChild(checkRow);

                listContainer.appendChild(card);
            });

            // Update Stats
            progCountEl.textContent = `${completedCount}/6`;
            volCountEl.textContent = totalVol;
            streakEl.textContent = state.streak;

            if (completedCount === EXERCISES.length) {
                mainActionBtn.textContent = 'Finish';
                mainActionBtn.classList.add('bg-sky-600');
                mainActionBtn.classList.remove('bg-emerald-600');
            } else {
                mainActionBtn.textContent = 'Start';
                mainActionBtn.classList.remove('bg-sky-600');
                mainActionBtn.classList.add('bg-emerald-600');
            }

            // Attach input listeners
            document.querySelectorAll('.sets-input').forEach(inp => {
                inp.onchange = (e) => {
                    const id = e.target.dataset.id;
                    let val = parseInt(e.target.value) || 1;
                    state.ex[id].sets = val;
                    state.ex[id].done = []; // Reset checks
                    saveState();
                    renderAll();
                };
            });
            document.querySelectorAll('.reps-input').forEach(inp => {
                inp.onchange = (e) => {
                    const id = e.target.dataset.id;
                    let val = parseInt(e.target.value) || 1;
                    state.ex[id].reps = val;
                    saveState();
                    // No re-render needed, just save
                };
            });
        }

        function updateStats() {
            let completedCount = 0;
            let totalVol = 0;
            EXERCISES.forEach(ex => {
                const st = state.ex[ex.id];
                const doneCount = st.done.filter(Boolean).length;
                if (doneCount >= st.sets) completedCount++;
                totalVol += st.done.reduce((a, b) => a + (b || 0), 0);
            });
            progCountEl.textContent = `${completedCount}/6`;
            volCountEl.textContent = totalVol;

            if (completedCount === EXERCISES.length) {
                mainActionBtn.textContent = 'Finish';
                mainActionBtn.classList.add('bg-sky-600');
                mainActionBtn.classList.remove('bg-emerald-600');
            }
        }

        // --- 3. ACTIONS ---
        
        // Timer Logic
        function startTimer(secs, nextName) {
            clearInterval(timerInterval);
            const overlay = document.getElementById('timerOverlay');
            const display = document.getElementById('timerDisplay');
            const ring = document.getElementById('timerRing');
            const label = document.getElementById('timerNextLabel');
            
            label.textContent = "Next: " + nextName;
            overlay.classList.add('active');
            
            let timeLeft = secs;
            const startVal = secs;
            display.textContent = timeLeft;
            ring.style.strokeDashoffset = 0;

            timerInterval = setInterval(() => {
                timeLeft--;
                display.textContent = timeLeft;
                const progress = (startVal - timeLeft) / startVal;
                ring.style.strokeDashoffset = 283 * progress;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    overlay.classList.remove('active');
                }
            }, 1000);
        }

        document.getElementById('skipBtn').onclick = () => {
            clearInterval(timerInterval);
            document.getElementById('timerOverlay').classList.remove('active');
        };

        document.getElementById('addTimeBtn').onclick = () => {
            // Just extend logic is complex for the ring, so we just add time and restart visual
            // For simplicity, we just add 30s to current display and keep going roughly
            // V2 feature: proper timer extension.
            // Simpler: Just restart timer with +30s
            const current = parseInt(document.getElementById('timerDisplay').textContent);
            clearInterval(timerInterval);
            startTimer(current + 30, document.getElementById('timerNextLabel').textContent.replace('Next: ', ''));
        };

        // Main Button
        mainActionBtn.onclick = () => {
            // Check completion
            let allDone = true;
            EXERCISES.forEach(ex => {
                if(state.ex[ex.id].done.filter(Boolean).length < state.ex[ex.id].sets) allDone = false;
            });

            if (allDone) {
                // SAVE
                state.hist.unshift({
                    date: new Date().toISOString(),
                    vol: state.ex.reduce((sum, x) => sum + state.ex[x.id].done.reduce((a,b)=>a+(b||0),0), 0) // Approx calculation
                });
                // Streak logic
                const today = new Date().toDateString();
                const last = state.hist.length > 1 ? new Date(state.hist[1].date).toDateString() : null;
                if(last !== today) state.streak++;
                
                // Reset
                EXERCISES.forEach(ex => {
                    state.ex[ex.id].done = [];
                });
                saveState();
                renderAll();
                alert("Workout Complete!");
                return;
            }

            // Find next incomplete
            const next = EXERCISES.find(ex => {
                const st = state.ex[ex.id];
                return st.done.filter(Boolean).length < st.sets;
            });

            if (next) {
                startTimer(90, next.name);
            }
        };

        // History
        document.getElementById('histBtn').onclick = () => {
            const list = document.getElementById('histList');
            if(state.hist.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-500 py-10">No history yet.</p>';
            } else {
                list.innerHTML = state.hist.map(h => {
                    const d = new Date(h.date);
                    return `
                        <div class="bg-[#111] p-3 rounded border border-[#1a1a1d]">
                            <div class="flex justify-between items-center">
                                <span class="font-medium text-sm">${d.toLocaleDateString()}</span>
                                <span class="text-xs text-emerald-400">${d.toLocaleTimeString()}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('histOverlay').classList.add('active');
        };
        
        document.getElementById('closeHistBtn').onclick = () => {
            document.getElementById('histOverlay').classList.remove('active');
        };

        // --- 4. INIT ---
        renderAll();

    </script>
</body>
</html>
