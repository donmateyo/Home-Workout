<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bodyweight Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --bg-card: #111113;
            --border: #1f1f23;
            --fg: #fafafa;
            --muted: #71717a;
            --accent: #34d399; /* Emerald */
            --accent-dim: rgba(52, 211, 153, 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--fg);
            height: 100vh; /* Fallback */
            height: 100dvh; /* Dynamic viewport height for mobile */
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Scrollable level container */
        .levels-scroll {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .levels-scroll::-webkit-scrollbar {
            display: none;
        }

        /* Checkbox styling */
        .set-check {
            appearance: none;
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            background: #0a0a0a;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .set-check:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .set-check:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--bg);
            border-radius: 50%;
        }

        /* Input styling */
        input[type="number"] {
            -moz-appearance: textfield;
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: var(--fg);
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            width: 48px;
            padding: 4px;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Modal/Overlay base */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Tooltip for muscle groups */
        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            margin-bottom: 5px;
        }
        
        .has-tooltip:hover .tooltip {
            opacity: 1;
        }

        /* Animation */
        @keyframes slideUp {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .exercise-row {
            animation: slideUp 0.4s ease forwards;
        }

        /* Safe area for modern iPhones */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .footer-btn {
                padding-bottom: calc(1rem + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

    <!-- Main App Container -->
    <div class="flex flex-col h-full w-full max-w-md mx-auto">

        <!-- Header -->
        <header class="flex items-center justify-between px-4 py-3 border-b border-[#1f1f23] flex-shrink-0">
            <div>
                <h1 class="text-lg font-bold tracking-tight leading-none">Bodyweight Pro</h1>
                <p class="text-[10px] text-[#71717a] mt-1 uppercase tracking-widest">Fundamental Routine</p>
            </div>
            <div class="flex items-center gap-4">
                <button id="historyBtn" aria-label="History" class="text-[#71717a] hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
                <div class="flex items-center gap-1.5 text-emerald-400">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.75 3.03v.568c0 .334.148.65.405.864l1.068.89c.442.369.535 1.01.216 1.49l-.51.766a2.25 2.25 0 01-1.161.886l-.143.048a1.107 1.107 0 00-.57 1.664c.369.555.169 1.307-.427 1.605L9 13.125l.423 1.059a.956.956 0 01-1.652.928l-.679-.906a1.125 1.125 0 00-1.906.172L4.5 15.75l-.612.153M12.75 3.031a9 9 0 00-8.862 12.872M12.75 3.031a9 9 0 016.69 14.036m0 0l-.177-.529A2.25 2.25 0 0017.128 15H16.5l-.324-.324a1.453 1.453 0 00-2.328.377l-.036.073a1.586 1.586 0 01-.982.816l-.99.282c-.55.157-.894.702-.8 1.267l.073.438c.08.474.49.821.97.821.846 0 1.598.542 1.865 1.345l.215.643m5.276-3.67a9.012 9.012 0 01-5.276 3.67m0 0a9 9 0 01-10.275-4.835M15.75 9c0 .896-.393 1.7-1.016 2.25"/></svg>
                    <span id="streakNum" class="text-sm font-bold">0</span>
                </div>
            </div>
        </header>

        <!-- Exercise List (Scroll container for small screens, but fits iPhone 16 PM) -->
        <div id="exerciseList" class="flex-1 overflow-y-auto px-2 py-2 space-y-2">
            <!-- JS injects rows here -->
        </div>

        <!-- Footer -->
        <footer class="flex-shrink-0 border-t border-[#1f1f23] bg-[#0a0a0a]">
            <div class="flex items-center justify-between px-4 py-2 text-xs text-[#71717a]">
                <div class="flex items-center gap-1">
                    <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                    <span>Completed: <span id="completedCount" class="text-white font-medium">0</span>/6</span>
                </div>
                <div>
                    Total Vol: <span id="totalVol" class="text-white font-medium">0</span> reps
                </div>
            </div>
            <button id="mainActionBtn" class="footer-btn w-full py-4 bg-emerald-600 text-white font-bold text-sm uppercase tracking-widest hover:bg-emerald-500 transition-colors active:scale-95">
                Start Workout
            </button>
        </footer>
    </div>

    <!-- Rest Timer Overlay -->
    <div id="timerOverlay" class="overlay flex-col text-center">
        <p class="text-xs uppercase tracking-[0.3em] text-[#71717a] mb-4">Rest Timer</p>
        <div class="relative w-48 h-48 flex items-center justify-center mb-6">
            <svg class="absolute w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" stroke="#1f1f23" stroke-width="6" fill="none"/>
                <circle id="timerCircle" cx="50" cy="50" r="45" stroke="#34d399" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="0"></circle>
            </svg>
            <span id="timerVal" class="text-5xl font-bold font-display">90</span>
        </div>
        <p id="nextExName" class="text-lg font-medium mb-8">Next: Push-ups</p>
        <div class="flex gap-4">
            <button id="skipBtn" class="px-6 py-2 bg-white/5 border border-white/10 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">Skip</button>
            <button id="addTimeBtn" class="px-6 py-2 bg-white/5 border border-white/10 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">+30s</button>
        </div>
    </div>

    <!-- History Overlay -->
    <div id="historyOverlay" class="overlay flex-col justify-start pt-12">
        <div class="w-full max-w-md">
            <div class="flex justify-between items-center mb-6 px-2">
                <h2 class="text-2xl font-bold font-display">History</h2>
                <button id="closeHistBtn" class="p-2 hover:bg-white/5 rounded-full"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div id="historyList" class="h-[60vh] overflow-y-auto space-y-3 px-2">
                <!-- History injected here -->
            </div>
        </div>
    </div>

    <script>
        // --- Data & State ---
        const ROUTINE = [
            { id: 'push', name: 'Push-ups', muscles: 'Chest, Triceps, Front Delts', levels: ['Wall', 'Incline', 'Kneeling', 'Regular', 'Decline', 'Diamond', 'Archer', 'One-Arm'], defLevel: 3, defSets: 3, defReps: 10 },
            { id: 'squat', name: 'Squats', muscles: 'Quads, Glutes, Core', levels: ['Assisted', 'Quarter', 'Half', 'Parallel', 'Deep', 'Pistol Prep', 'Pistol'], defLevel: 3, defSets: 3, defReps: 12 },
            { id: 'pull', name: 'Pull-ups', muscles: 'Lats, Biceps, Grip', levels: ['Dead Hang', 'Scapular', 'Chin Neg', 'Chin-up', 'Pull-up', 'Wide Grip', 'Weighted'], defLevel: 3, defSets: 3, defReps: 5 },
            { id: 'dip', name: 'Dips', muscles: 'Triceps, Lower Chest', levels: ['Bench', 'Assisted', 'Parallel Neg', 'Parallel', 'Deep', 'Weighted'], defLevel: 0, defSets: 3, defReps: 10 },
            { id: 'hinge', name: 'Leg Raises', muscles: 'Abs, Hip Flexors', levels: ['Knee Tuck', 'Flat Knee', 'Flat Leg', 'Hanging Knee', 'Hanging Leg', 'Toes-to-Bar'], defLevel: 1, defSets: 3, defReps: 12 },
            { id: 'lunge', name: 'Lunges', muscles: 'Quads, Glutes, Balance', levels: ['Assisted', 'Static', 'Forward', 'Reverse', 'Walking', 'Jumping', 'Bulgarian'], defLevel: 2, defSets: 3, defReps: 10 }
        ];

        const LS_KEY = 'bwProData';
        let state = loadState();
        let timerInterval = null;
        let timerTime = 0;

        function loadState() {
            const data = localStorage.getItem(LS_KEY);
            if (!data) {
                const initial = { exercises: {}, history: [], streak: 0 };
                ROUTINE.forEach(ex => {
                    initial.exercises[ex.id] = { level: ex.defLevel, sets: ex.defSets, reps: ex.defReps, done: [] };
                });
                return initial;
            }
            return JSON.parse(data);
        }

        function saveState() {
            localStorage.setItem(LS_KEY, JSON.stringify(state));
        }

        // --- Rendering ---
        function renderList() {
            const container = document.getElementById('exerciseList');
            container.innerHTML = '';

            ROUTINE.forEach((ex, index) => {
                const exState = state.exercises[ex.id];
                const row = document.createElement('div');
                row.className = 'exercise-row bg-[#111113] rounded-lg border border-[#1f1f23] p-2.5 flex flex-col gap-2';
                row.style.animationDelay = `${index * 50}ms`;

                // Level pills HTML generation
                let pillsHtml = ex.levels.map((lvl, i) => 
                    `<button class="lvl-btn px-2.5 py-1 rounded text-[10px] font-medium transition-colors whitespace-nowrap ${i === exState.level ? 'bg-emerald-500 text-black' : 'bg-[#0a0a0a] text-[#71717a] hover:text-white'}" data-lvl="${i}">${lvl}</button>`
                ).join('');

                // Checkboxes
                let checksHtml = '';
                for(let i=0; i<exState.sets; i++) {
                    checksHtml += `<input type="checkbox" class="set-check" data-idx="${i}" ${exState.done[i] ? 'checked' : ''} aria-label="Set ${i+1}">`;
                }

                row.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="has-tooltip relative">
                            <h3 class="text-sm font-semibold font-display text-white">${ex.name}</h3>
                            <div class="tooltip">${ex.muscles}</div>
                        </div>
                        <div class="flex items-center gap-2 text-[#71717a]">
                            <div class="flex items-center gap-1 text-xs">
                                <input type="number" class="h-6 text-xs w-7 p-0 border-0 bg-transparent text-center font-bold text-white" value="${exState.sets}" min="1" max="10" data-field="sets" aria-label="Sets">
                                <span class="opacity-50">x</span>
                                <input type="number" class="h-6 text-xs w-9 p-0 border-0 bg-transparent text-center font-bold text-white" value="${exState.reps}" min="1" max="100" data-field="reps" aria-label="Reps">
                            </div>
                        </div>
                    </div>
                    <div class="levels-scroll flex gap-1 overflow-x-auto pb-1 -mb-1">
                        ${pillsHtml}
                    </div>
                    <div class="flex justify-between items-center pt-1 border-t border-[#1f1f23]">
                        <div class="text-[10px] text-[#71717a] uppercase tracking-wider">Progression</div>
                        <div class="flex gap-2">
                            ${checksHTML}
                        </div>
                    </div>
                `;

                // Correct the innerHTML construction for checkboxes
                const checkContainer = row.querySelector('.flex.gap-2');
                for(let i=0; i<exState.sets; i++) {
                    const chk = document.createElement('input');
                    chk.type = 'checkbox';
                    chk.className = 'set-check';
                    chk.dataset.idx = i;
                    chk.checked = exState.done[i] ? true : false;
                    chk.setAttribute('aria-label', `Set ${i+1}`);
                    checkContainer.appendChild(chk);
                }

                // Events
                row.querySelectorAll('.lvl-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        state.exercises[ex.id].level = parseInt(btn.dataset.lvl);
                        saveState();
                        renderList();
                    });
                });

                row.querySelectorAll('input[data-field]').forEach(inp => {
                    inp.addEventListener('change', (e) => {
                        const val = parseInt(e.target.value) || 1;
                        state.exercises[ex.id][e.target.dataset.field] = val;
                        // Reset done if sets change?
                        if(e.target.dataset.field === 'sets') state.exercises[ex.id].done = [];
                        saveState();
                        renderList();
                    });
                });

                row.querySelectorAll('.set-check').forEach(chk => {
                    chk.addEventListener('change', (e) => {
                        const idx = parseInt(e.target.dataset.idx);
                        if(!state.exercises[ex.id].done) state.exercises[ex.id].done = [];
                        if(e.target.checked) {
                            state.exercises[ex.id].done[idx] = state.exercises[ex.id].reps; // default to target reps
                        } else {
                            state.exercises[ex.id].done[idx] = false;
                        }
                        saveState();
                        updateStats();
                    });
                });

                container.appendChild(row);
            });
            updateStats();
        }

        function updateStats() {
            let completed = 0;
            let volume = 0;
            ROUTINE.forEach(ex => {
                const st = state.exercises[ex.id];
                const setsDone = st.done.filter(Boolean).length;
                if(setsDone >= st.sets) completed++;
                volume += st.done.reduce((a,b) => a + (b||0), 0);
            });
            
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalVol').textContent = volume;
            
            const btn = document.getElementById('mainActionBtn');
            if(completed === ROUTINE.length) {
                btn.textContent = 'Finish & Save';
                btn.classList.add('bg-sky-600');
                btn.classList.remove('bg-emerald-600');
            } else {
                btn.textContent = 'Start Workout';
                btn.classList.remove('bg-sky-600');
                btn.classList.add('bg-emerald-600');
            }
            
            // Calc Streak
            let streak = 0;
            const today = new Date().toDateString();
            if(state.history.length > 0 && new Date(state.history[0].date).toDateString() === today) streak = 1;
            // Simple streak logic: check previous days
            let d = new Date();
            d.setDate(d.getDate()-1);
            // For simplicity, let's assume the server tracks this, but for this app we just check if yesterday exists
            // Simplified logic for streak:
            document.getElementById('streakNum').textContent = state.streak || 0;
        }

        // --- Logic ---
        function startTimer(duration, nextName) {
            const overlay = document.getElementById('timerOverlay');
            const display = document.getElementById('timerVal');
            const circle = document.getElementById('timerCircle');
            const nextText = document.getElementById('nextExName');
            
            nextText.textContent = `Next: ${nextName}`;
            overlay.classList.add('active');
            
            timerTime = duration;
            display.textContent = timerTime;
            circle.style.strokeDashoffset = 0; // Reset visual
            
            const startOffset = 283;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerTime--;
                display.textContent = timerTime;
                const progress = (duration - timerTime) / duration;
                circle.style.strokeDashoffset = startOffset * progress;
                
                if(timerTime <= 0) {
                    clearInterval(timerInterval);
                    overlay.classList.remove('active');
                }
            }, 1000);
        }

        function skipTimer() {
            clearInterval(timerInterval);
            document.getElementById('timerOverlay').classList.remove('active');
        }
        
        function addTime() {
            timerTime += 30;
            // We need to adjust the max duration for the circle animation logic to stay smooth, 
            // but for simplicity we'll just update the text and extend.
            document.getElementById('timerVal').textContent = timerTime;
        }

        function handleMainAction() {
            // Check if workout complete
            let completed = 0;
            ROUTINE.forEach(ex => {
                const st = state.exercises[ex.id];
                if(st.done.filter(Boolean).length >= st.sets) completed++;
            });

            if(completed === ROUTINE.length) {
                // Save workout
                const workout = {
                    date: new Date().toISOString(),
                    routine: JSON.parse(JSON.stringify(state.exercises))
                };
                state.history.unshift(workout);
                if(state.history.length > 20) state.history.pop();
                
                // Update Streak
                const lastDate = state.history.length > 1 ? new Date(state.history[1].date).toDateString() : null;
                const today = new Date().toDateString();
                if(lastDate !== today) {
                    // Simple check: if last workout was yesterday or earlier, increment?
                    // Real streak logic requires checking date diffs. 
                    // Let's keep it simple: if today's date isn't the same as last entry (which we just added), increment?
                    // Actually, we just added today's entry. So logic is complex. 
                    // Let's just set streak based on consecutive days found in history.
                    // For this snippet, we'll just increment if not already counted today.
                    state.streak = (state.streak || 0) + 1;
                }
                
                saveState();
                
                // Reset state for next time
                ROUTINE.forEach(ex => {
                    state.exercises[ex.id].done = [];
                });
                saveState();
                renderList();
                
                // Show confirmation
                alert('Workout Saved! Great job.');
                return;
            }

            // Find next incomplete exercise
            const nextEx = ROUTINE.find(ex => {
                const st = state.exercises[ex.id];
                return st.done.filter(Boolean).length < st.sets;
            });

            if(nextEx) {
                startTimer(90, nextEx.name);
            }
        }

        function showHistory() {
            const list = document.getElementById('historyList');
            if(state.history.length === 0) {
                list.innerHTML = '<p class="text-center text-[#71717a]">No history yet.</p>';
            } else {
                list.innerHTML = state.history.map(h => {
                    const d = new Date(h.date);
                    return `
                    <div class="bg-[#111113] p-3 rounded-lg border border-[#1f1f23]">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-medium">${d.toLocaleDateString()}</span>
                            <span class="text-xs text-[#71717a]">${d.toLocaleTimeString()}</span>
                        </div>
                        <div class="text-xs text-emerald-400">${ROUTINE.length} exercises completed</div>
                    </div>
                    `;
                }).join('');
            }
            document.getElementById('historyOverlay').classList.add('active');
        }

        // --- Init ---
        function init() {
            renderList();
            
            document.getElementById('mainActionBtn').addEventListener('click', handleMainAction);
            document.getElementById('skipBtn').addEventListener('click', skipTimer);
            document.getElementById('addTimeBtn').addEventListener('click', addTime);
            document.getElementById('historyBtn').addEventListener('click', showHistory);
            document.getElementById('closeHistBtn').addEventListener('click', () => {
                document.getElementById('historyOverlay').classList.remove('active');
            });
        }
        
        init();
    </script>
</body>
</html>
